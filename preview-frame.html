<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>preview frame</title>
<style>
html,body{margin:0;background:#888;}
figure{margin:0;padding:12px;}
figcaption{color:#fff;font:12px/1.6 sans-serif;padding:0 0 5px;}
iframe{border:0;background:#fff;display:block;}
</style>
</head><body>
<figure><figcaption id="cap">preview</figcaption><iframe id="fr" src="/" width="1280" height="800" title="preview"></iframe></figure>
<script>
var p=new URLSearchParams(location.search);
var w=parseInt(p.get('w')||'1280',10), h=parseInt(p.get('h')||'800',10), u=p.get('u')||'/#method';
var fr=document.getElementById('fr');
fr.width=w; fr.height=h; fr.src=u;
document.getElementById('cap').textContent=w+'px '+u;
</script>
</body></html>
